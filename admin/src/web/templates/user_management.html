{% extends "layout.html" %}

{% block title %}Manejo usuarios{% endblock %}

{% block content %}
<h1>Usuarios</h1>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Email</th>
            <th>Descripcion</th>
            <th>Rol</th>
        </tr>
    </thead>
    <tbody>
        {% for issue in issues %}
        <tr>
            <td>{{ issue.id }}</td>
            <td>{{ issue.email}}</td>
            <td>{{ issue.description }}</td>
            <td>{{ issue.rol }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<a href="{{ url_for('home') }}">Volver al inicio</a>
{% endblock %}
