{% extends "layout.html" %}

{% block title %}Agregar Sitio{% endblock %}

{% block content %}

<!-- Leaflet CSS y JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<style>
  #map { height: 400px; width: 100%; margin-bottom: 10px; border: 1px solid #ccc; }
</style>



<h2>Agregar Sitio Histórico</h2>

<a href="/">
    <button type="button">Volver a inicio</button>
</a>
<a href="{{ next_url }}">
  <button type="button">Volver atras</button>
</a>

<form method="post">
    <label>Nombre:</label>
    <input type="text" name="nombre" required><br>

    <label>Descripción:</label>
    <input type="text" name="descripcion" required><br>

    <label>Descripción Completa:</label>
    <input type="text" name="descripcion_completa"><br>

    <label>Provincia:</label>
    <select id="provinciaSelect">
        <option value="">Seleccione provincia</option>
        {% for p in provincias %}
        <option value="{{ p.id }}">{{ p.nombre }}</option>
        {% endfor %}
    </select><br>

    <label>Ciudad:</label>
    <select id="ciudadSelect" name="ciudad" disabled>
        <option value="">Seleccione ciudad</option>
        {% for c in ciudades %}
        <option value="{{ c.id }}" data-provincia="{{ c.idProvincia }}">{{ c.nombre }}</option>
        {% endfor %}
    </select><br>

    <label>Estado Conservación:</label>
    <select name="estado_conservacion" required>
        <option value="">Seleccione estado</option>
        <option value="Bueno">Bueno</option>
        <option value="Regular">Regular</option>
        <option value="Malo">Malo</option>
    </select><br>

    <label>Fecha Inauguracion:</label>
    <input type="date" name="fecha_inauguracion"><br>

    <label>Categoría:</label>
    <select name="categoria" required>
        <option value="">Seleccione categoría</option>
        {% for c in categorias %}
        <option value="{{ c.id }}">{{ c.nombre }}</option>
        {% endfor %}
    </select><br>

    <label>Fecha Registro:</label>
    <input type="date" name="fecha_registro"><br>

    <label>Tags:</label><br>
    <div style="border: 1px solid #ccc; padding: 10px; max-height: 150px; overflow-y: auto;">
        {% for tag in tags %}
            <input type="checkbox" id="tag_{{ tag.id }}" name="tags" value="{{ tag.id }}">
            <label for="tag_{{ tag.id }}">{{ tag.nombre }}</label><br>
        {% endfor %}
        {% if not tags %}
          <p>No hay tags disponibles.</p>
        {% endif %}
    </div>
    <br>

    <input type="hidden" name="latitud" id="latitud">
    <input type="hidden" name="longitud" id="longitud">

    <div style="max-width: 600px; margin: 10px auto;">
        <label>Ubicación (seleccione en el mapa):</label>
        <div id="map"></div>
    </div>

    <button type="submit">Guardar</button>
</form>

<script>
  // Inicializa el mapa centrado en La Plata por defecto
  var map = L.map('map').setView([-34.921, -57.954], 13);

  // Capa OpenStreetMap
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
  }).addTo(map);

  var marker;

  // Captura clic del usuario
  map.on('click', function(e) {
      var lat = e.latlng.lat.toFixed(6);
      var lng = e.latlng.lng.toFixed(6);

      // Coloca o mueve el marcador
      if (marker) {
          marker.setLatLng(e.latlng);
      } else {
          marker = L.marker(e.latlng).addTo(map);
      }

      // Guardar coordenadas en inputs separados
      document.getElementById('latitud').value = lat;
      document.getElementById('longitud').value = lng;
  });
</script>

<script>
  // Filtrado de ciudades por provincia (alta)
  (function() {
    var provSel = document.getElementById('provinciaSelect');
    var ciudadSel = document.getElementById('ciudadSelect');
    if (!provSel || !ciudadSel) return;

    // Guardamos una copia de todas las opciones iniciales (incluye placeholder y todas las ciudades)
    var allCityOptions = Array.from(ciudadSel.querySelectorAll('option'));

    function actualizarCiudades() {
      var provId = provSel.value;

      // Resetear opciones dejando placeholder
      ciudadSel.innerHTML = '';
      var placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = 'Seleccione ciudad';
      ciudadSel.appendChild(placeholder);

      if (!provId) {
        ciudadSel.disabled = true;
        return;
      }

      // Agregar solo las ciudades de la provincia elegida
      allCityOptions.forEach(function(opt) {
        var pid = opt.getAttribute('data-provincia');
        if (pid === provId) {
          ciudadSel.appendChild(opt.cloneNode(true));
        }
      });

      ciudadSel.disabled = false;
    }

    // Inicializa estado deshabilitado hasta que elijan provincia
    ciudadSel.disabled = true;
    provSel.addEventListener('change', actualizarCiudades);
  })();
</script>

{% endblock %}
