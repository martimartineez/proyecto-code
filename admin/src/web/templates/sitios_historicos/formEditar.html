{% extends "layout.html" %}
{% block title %}Editar Sitio{% endblock %}
{% block content %}

<!-- Leaflet CSS y JS -->
<link rel="stylesheet" href="{{ url_for('static', filename='dist/leaflet.css') }}">
<script src="{{ url_for('static', filename='dist/leaflet.js') }}"></script>

<style>
  #map { height: 400px; width: 100%; margin-bottom: 10px; border: 1px solid #ccc; }
</style>

<h2>Editar Sitio Histórico</h2>

<a href="{{ url_for('sitios_historicos.index') }}">Volver</a>

<form method="post" action="{{ url_for('sitios_historicos.editar_sitio', sitio_id=sitio.id) }}">
    <label>Nombre:</label>
    <input type="text" name="nombre" value="{{ sitio.nombre }}" required><br>

    <label>Descripción:</label>
    <input type="text" name="descripcion" value="{{ sitio.descBreve }}" required><br>

    <label>Descripción Completa:</label>
    <input type="text" name="descripcion_completa" value="{{ sitio.descCompleta }}"><br>

    {# Provincia y Ciudad como selects dependientes #}
    <label>Provincia:</label>
    <select id="provinciaSelect">
        <option value="">Seleccione provincia</option>
        {% set selectedProv = sitio.ciudad.provincia.id if sitio.ciudad and sitio.ciudad.provincia else '' %}
        {% for p in provincias %}
        <option value="{{ p.id }}" {% if selectedProv == p.id %}selected{% endif %}>{{ p.nombre }}</option>
        {% endfor %}
    </select><br>

    <label>Ciudad:</label>
    <select id="ciudadSelect" name="ciudad">
        <option value="">Seleccione ciudad</option>
        {% for c in ciudades %}
        <option value="{{ c.id }}" data-provincia="{{ c.idProvincia }}" {% if sitio.idCiudad == c.id %}selected{% endif %}>{{ c.nombre }}</option>
        {% endfor %}
    </select><br>

    <label>Estado Conservación:</label>
    <select name="estado_conservacion" required>
        <option value="">Seleccione estado</option>
        <option value="Bueno" {% if sitio.estadoConservacion == 'Bueno' %}selected{% endif %}>Bueno</option>
        <option value="Regular" {% if sitio.estadoConservacion == 'Regular' %}selected{% endif %}>Regular</option>
        <option value="Malo" {% if sitio.estadoConservacion == 'Malo' %}selected{% endif %}>Malo</option>
    </select><br>

    <label>Fecha Inauguracion:</label>
    <input type="date" name="fecha_inauguracion" 
       value="{{ sitio.anioInauguracion.strftime('%Y-%m-%d') if sitio.anioInauguracion else '' }}"><br>

    <label>Categoría:</label>
    <select name="categoria" required>
        <option value="">Seleccione categoría</option>
        {% for c in categorias %}
        <option value="{{ c.id }}" {% if sitio.idCategoria == c.id %}selected{% endif %}>{{ c.nombre }}</option>
        {% endfor %}
    </select><br>

    <label>Fecha Registro:</label>
    <input type="date" name="fecha_registro" 
       value="{{ sitio.fechaRegistro.strftime('%Y-%m-%d') if sitio.fechaRegistro else '' }}"><br>

    <label>Visible a los usuarios:</label>
    <input type="hidden" name="visible" value="False">
    <input type="checkbox" name="visible" value="True" {% if sitio.visible %}checked{% endif %}><br>

    <input type="hidden" name="latitud" id="latitud" value="{{ sitio.latitud }}">
    <input type="hidden" name="longitud" id="longitud" value="{{ sitio.longitud }}">

    <div style="max-width: 600px; margin: 10px auto;">
        <label>Ubicación (seleccione en el mapa):</label>
        <div id="map"></div>
    </div>

    <button type="submit">Guardar cambios</button>
</form>

<script>
  // Obtener coordenadas desde los inputs del formulario (evitar Jinja en JS)
  var latInput = document.getElementById('latitud');
  var lngInput = document.getElementById('longitud');
  var latStr = latInput && latInput.value ? latInput.value : '';
  var lngStr = lngInput && lngInput.value ? lngInput.value : '';
  var hasCoords = latStr !== '' && lngStr !== '';
  var existingLat = hasCoords ? parseFloat(latStr) : -34.921;
  var existingLng = hasCoords ? parseFloat(lngStr) : -57.954;

  // Inicializa el mapa centrado en las coordenadas existentes o La Plata por defecto
  var map = L.map('map').setView([existingLat, existingLng], 13);

  // Capa OpenStreetMap
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
  }).addTo(map);

  var marker;

  // Si hay coordenadas existentes, mostrar marcador
  if (hasCoords) {
    marker = L.marker([existingLat, existingLng]).addTo(map);
  }

  // Captura clic del usuario
  map.on('click', function(e) {
      var lat = e.latlng.lat.toFixed(6);
      var lng = e.latlng.lng.toFixed(6);

      // Coloca o mueve el marcador
      if (marker) {
          marker.setLatLng(e.latlng);
      } else {
          marker = L.marker(e.latlng).addTo(map);
      }

      latInput.value = lat;
      lngInput.value = lng;
  });
</script>

<script>
  // Filtrar ciudades por provincia (edición)
  (function() {
    var provSel = document.getElementById('provinciaSelect');
    var ciudadSel = document.getElementById('ciudadSelect');
    if (!provSel || !ciudadSel) return;

    // Guardamos una copia de todas las opciones iniciales
    var allCityOptions = Array.from(ciudadSel.querySelectorAll('option'));

    function actualizarCiudades() {
      var provId = provSel.value;
      var selectedCiudad = ciudadSel.value; // recordar selección actual

      // Resetear opciones dejando placeholder
      ciudadSel.innerHTML = '';
      var placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = 'Seleccione ciudad';
      ciudadSel.appendChild(placeholder);

      // Agregar solo las ciudades de la provincia seleccionada
      allCityOptions.forEach(function(opt) {
        var pid = opt.getAttribute('data-provincia');
        if (opt.value === '' || pid === provId) {
          ciudadSel.appendChild(opt.cloneNode(true));
        }
      });

      // Restaurar selección si sigue siendo válida
      if (selectedCiudad) {
        ciudadSel.value = selectedCiudad;
        // Si no existe en la nueva lista, queda placeholder
        if (ciudadSel.value !== selectedCiudad) {
          ciudadSel.value = '';
        }
      }
    }

    // Inicializar segun provincia ya seleccionada
    actualizarCiudades();

    // Refiltrar al cambiar la provincia
    provSel.addEventListener('change', actualizarCiudades);
  })();
</script>

{% endblock %}
