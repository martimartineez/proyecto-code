{% extends "layout.html" %}
{% block title %}Gestión de Tags{% endblock %}
{% block content %}
<h1>Gestión de Tags</h1>

<p>
    <a href="{{ url_for('tags.agregar_tag') }}">Agregar nuevo Tag</a>
</p>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for tag in tags %}
        <tr>
            <td>{{ tag.id }}</td>
            <td>{{ tag.nombre }}</td>
            <td>
                <a href="{{ url_for('tags.editar_tag', tag_id=tag.id) }}">
                    <button type="button">Editar</button>
                </a>
                <form action="{{ url_for('tags.eliminar_tag', tag_id=tag.id)}}" method="post" style="display:inline;">
                    <button type="submit" onclick="return confirm('¿Estás seguro de que quieres eliminar el tag: {{ tag.nombre }}?');">Eliminar</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<a href="/">Volver a inicio</a>
{% endblock %}
